<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0a08" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />

    <!--
      Title and description are set statically here rather than only by the Seo
      component. That component runs in a useEffect, so a crawler or social
      scraper that does not execute JavaScript would otherwise see nothing.
      Product pages still override these client-side for signed-in users;
      server-rendered per-route metadata is tracked in docs/ROADMAP.md Phase 7.

      ⚠ Replace the og:url / twitter:site values and the JSON-LO below with the
        production domain before launch — a share card pointing at localhost is
        worse than no card at all.
    -->
    <title>Black House — Small-batch outerwear</title>
    <meta
      name="description"
      content="Small-batch outerwear cut in Bhopal: wool overcoats, trenches, field coats and bombers. Numbered runs, GST-inclusive pricing, 7-day returns."
    />
    <link rel="canonical" href="https://REPLACE-WITH-YOUR-DOMAIN/" />

    <!-- Open Graph: this is what renders when a product link is shared on
         WhatsApp, which is the primary discovery channel for a D2C brand. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Black House" />
    <meta property="og:title" content="Black House — Small-batch outerwear" />
    <meta
      property="og:description"
      content="Wool overcoats, trenches and field coats, cut in numbered runs in Bhopal."
    />
    <meta property="og:url" content="https://REPLACE-WITH-YOUR-DOMAIN/" />
    <meta property="og:image" content="https://REPLACE-WITH-YOUR-DOMAIN/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Black House — small-batch outerwear" />
    <meta property="og:locale" content="en_IN" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Black House — Small-batch outerwear" />
    <meta
      name="twitter:description"
      content="Wool overcoats, trenches and field coats, cut in numbered runs in Bhopal."
    />
    <meta name="twitter:image" content="https://REPLACE-WITH-YOUR-DOMAIN/og-image.png" />

    <!-- Structured data: lets Google show the brand panel, and is the hook a
         Product/Offer rich result needs. Values here must match the page. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ClothingStore",
        "name": "Black House",
        "description": "Small-batch outerwear cut in Bhopal, Madhya Pradesh.",
        "url": "https://REPLACE-WITH-YOUR-DOMAIN/",
        "image": "https://REPLACE-WITH-YOUR-DOMAIN/og-image.png",
        "priceRange": "₹₹₹",
        "currenciesAccepted": "INR",
        "paymentAccepted": "Credit Card, Debit Card, UPI, Net Banking, Cash on Delivery",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Bhopal",
          "addressRegion": "Madhya Pradesh",
          "postalCode": "462001",
          "addressCountry": "IN"
        },
        "areaServed": { "@type": "Country", "name": "India" }
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
