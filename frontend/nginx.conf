# Black House storefront — nginx runtime config.
#
# Copied to /etc/nginx/templates/default.conf.template; the official nginx image
# substitutes ${BACKEND_ORIGIN} / ${NGINX_PORT} at container start, so one image
# works across dev, staging and production.
#
# The SPA calls `/api/v1/...` same-origin (VITE_API_BASE_URL=/api/v1) and this
# server forwards it to the FastAPI backend — that removes CORS from the picture
# entirely. Only set VITE_API_BASE_URL to an absolute URL if you terminate the
# API on a different host, in which case drop the `/api` location below.

server {
    listen       ${NGINX_PORT};
    listen  [::]:${NGINX_PORT};
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Basic hardening / hygiene
    server_tokens off;
    client_max_body_size 25m;          # product image uploads go through the API

    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_vary         on;
    gzip_types        text/plain text/css text/xml application/json application/javascript
                      application/xml+rss application/rss+xml image/svg+xml font/woff2;

    # Container healthcheck endpoint (no upstream involved)
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # ── API + uploaded media → FastAPI backend ──────────────────────────────
    location /api/ {
        proxy_pass         ${BACKEND_ORIGIN};
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 75s;
    }

    location /static/ {
        proxy_pass         ${BACKEND_ORIGIN};
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
        expires            7d;
        add_header         Cache-Control "public";
    }

    location = /openapi.json { proxy_pass ${BACKEND_ORIGIN}; }
    location /docs    { proxy_pass ${BACKEND_ORIGIN}; }
    location /redoc   { proxy_pass ${BACKEND_ORIGIN}; }

    # ── Immutable hashed assets ─────────────────────────────────────────────
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files  $uri =404;
    }

    # ── SPA fallback: client-side routing owns every other path ─────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache the HTML shell, or a deploy won't reach users
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires    0;
    }

    # Security headers
    add_header X-Content-Type-Options "nosniff"          always;
    add_header X-Frame-Options        "SAMEORIGIN"       always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy     "camera=(), microphone=(), geolocation=()" always;
}
