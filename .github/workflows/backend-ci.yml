name: backend-ci

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"

      # --- Lint gates (fail fast, before the slower test/migration steps) ---
      # Both are clean on the current tree, so these block regressions rather
      # than reporting pre-existing debt. See the two `style:`/`chore:` commits
      # that cleared the backlog for why UP046 is ignored in pyproject.toml.
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .

      - name: Alembic migration check (sqlite mirror)
        run: |
          DATABASE_URL="sqlite:///./ci.db" alembic upgrade head
      - name: Pytest
        run: pytest -q
