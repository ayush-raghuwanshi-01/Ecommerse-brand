[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blackhouse-backend"
version = "1.0.0"
description = "Black House — modular-monolith commerce backend (FastAPI, SQLAlchemy 2, PostgreSQL)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Black House Engineering" }]

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36,<2.1",
    "alembic>=1.14",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "PyJWT>=2.9",
    "argon2-cffi>=23.1",
    "httpx>=0.27",
    "python-multipart>=0.0.12",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
# Redis is optional: used only for rate limiting / shared checkout state when configured.
redis = ["redis>=5.2"]
# S3-compatible object storage; local storage works without it.
s3 = ["boto3>=1.35"]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "redis>=5.2",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning:passlib.*",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # Depends() in default args is FastAPI idiomatic
